# Config for train_single_emulator_cosmic_shear.py
#
# The data files below are bare filenames; the driver resolves them under
# $ROOTDIR/<--root>/chains (where dataset_generator_lensing.py writes the
# dvs / params / covmat), so no folder prefix and no dependence on the
# launch directory. The cosmolike_data_dir / cosmolike_dataset keys are
# separate: they live under $ROOTDIR/external_modules/data, not under --root.

data:
  train_dv:     w0wa_takahashi_dvs_train_cs_16.npy
  train_params: w0wa_takahashi_params_train_cs_16.1.txt
  train_covmat: w0wa_takahashi_params_train_cs_16.covmat
  val_dv:       w0wa_takahashi_dvs_train_cs_8.npy
  val_params:   w0wa_takahashi_params_train_cs_8.1.txt

  cosmolike_data_dir: lsst_y1
  cosmolike_dataset:  lsst_y1_M1_GGL0.05.dataset

  omegabh2_cut:  0.035   # drop omega_b h^2 >= this (the hard corner)
  omegabh2_lo:   0.014   # ... and <= this (Planck omega_b h^2 = 0.0224;
                         # omit for no lower cut)
  omegam2h2_lo:  0.015   # keep omegam^2 h^2 = (Omega_m H0/100)^2 above this
  omegam2h2_hi:  0.08    # ... and below this (both tails are rarefied and
                         # fail; Planck sits at 0.045; omit a key for no cut)
  train_divisor: 10      # N_train = N // train_divisor
  val_divisor:   50      # N_val   = N // val_divisor
  split_seed:    0
  ram_frac:      0.7     # RAM fraction stage_source may fill

train_args:
  nepochs:   1600
  bs:        256
  loss_mode: sqrt        # sqrt | chi2 | sqrt_dchi2
  silent:    false       # false -> per-epoch progress lines

  model:
    # `name` picks the network; the other keys are its kwargs.
    #
    # Choose exactly ONE name. YAML keeps the LAST `name:` key silently,
    # so do not leave two uncommented (that is why a stray duplicate runs
    # the wrong model with no error). The startup banner prints the
    # resolved class, so check it matches what you intended.
    #
    #   resmlp  Plain residual MLP. The baseline; maps the whitened
    #           parameters straight to the whitened data vector.
    #
    #   rescnn  ResMLP trunk + a 1-D CNN correction head (uncomment the
    #           CNN knobs below). For theta-structured residuals.
    #
    #   nla     Factored intrinsic alignment. The net emits 3 templates
    #           and the loss combines them in closed form:
    #             xi = K1 + A1 * K2 + A1^2 * K3
    #           The amplitude A1 (= LSST_A1_1) never enters the network,
    #           so the emulator is exact in it and its prior costs zero
    #           training coverage. LSST_A1_2 (the eta power) stays an input.
    #
    #   rescnn_nla  nla plus rescnn's 1-D CNN correction head: the trunk
    #           emits the 3 templates and ONE shared gated conv corrects
    #           each of them in theta order before the loss combines
    #           them. The amplitude polynomial is untouched, so the
    #           correction stays exact in A1. Takes the CNN knobs below.
    #
    name:        resmlp
    #
    # Trunk kwargs (all models):
    int_dim_res: 128         # residual-block width
    n_blocks:    4           # number of residual blocks
    #
    # Activation for the ResBlocks (the conv head shares it). One of:
    #   H            the paper's learnable leaky/Swish gate (the default)
    #   power        H with a bounded learnable tail exponent
    #   multigate    K independent gates (K = n_gates)
    #   gated_power  K gates + the tail exponent
    # The --activation flag, when given, overrides this key.
    # activation: H
    # n_gates:    3          # gates K for multigate / gated_power
    #
    # Conv-head knobs (rescnn / rescnn_nla; ignored by the others):
    # kernel_size:  11       # conv kernel width (odd)
    # channels:     16       # conv filters in the 1D-CNN appendix
    # n_blocks_cnn: 1        # stacked CNN correction blocks
    # gate_init:    0.1      # initial correction-gate scale (small, not 0)
    # compile_mode: default  # conv models default to this already (CUDA
    #                        # graphs trip on the gated skip-add); set it
    #                        # only to override.
    #
    # nla / rescnn_nla need no other kwargs: n_amps and the 3 templates
    # plus the amplitude column names are set automatically
    # (experiment.py).

  optimizer:             # cls is fixed to AdamW in the script
    weight_decay: 0.0

  lr:                    # learning rate = lr_base * sqrt(bs / bs_base)
    lr_base:       0.0025
    bs_base:       64.0
    warmup_epochs: 10

  scheduler:             # cls is fixed to ReduceLROnPlateau
    mode:     min
    patience: 25
    factor:   0.8

  trim:                  # hold `start`, then ease to `end`
    start:         0.1
    end:           0.025
    hold_epochs:   50
    anneal_epochs: 300
    shape:         cosine

  focus:                 # focal hardness weighting (gamma schedule)
    start:         0.0
    end:           2.0
    hold_epochs:   50
    anneal_epochs: 300
    shape:         linear
    kappa:         0.15
